<title>Marquee Shows</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: sticky marquee header; a feed of collapsible ticket stubs (date stub | details); on wide screens a sticky "your upcoming" panel on the right. */
:root{
  --bg:#EEF0F4; --surface:#FFFFFF; --sunk:#E4E7EE; --ink:#15161C; --muted:#5E6272; --line:#D5D8E0;
  --bulb:#F2A900; --bulb-ink:#15161C;
  --music:#2F6FEB; --comedy:#D93A6C; --theater:#0F8F7B; --go:#1C8A4C; --warn:#B4540A;
  --display:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:10px; --hdr:150px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101117; --surface:#191A22; --sunk:#14151C; --ink:#ECEDF2; --muted:#9A9EAD; --line:#2A2C38;
  --bulb:#F5B92E; --bulb-ink:#15161C;
  --music:#7FA6FF; --comedy:#FF7AA2; --theater:#45CDB2; --go:#4CC985; --warn:#F0A04B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101117; --surface:#191A22; --sunk:#14151C; --ink:#ECEDF2; --muted:#9A9EAD; --line:#2A2C38;
  --bulb:#F5B92E; --bulb-ink:#15161C;
  --music:#7FA6FF; --comedy:#FF7AA2; --theater:#45CDB2; --go:#4CC985; --warn:#F0A04B; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
a{color:inherit}
.layout{overflow-x:clip}
#side{display:none}
@media (min-width:1100px){
  .wrap{max-width:1180px}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
  #side{display:grid;gap:14px;position:sticky;top:calc(var(--hdr) + 14px);margin-top:22px;max-height:calc(100vh - var(--hdr) - 30px);overflow:auto;padding-bottom:12px}
}

/* Header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:grid;gap:10px;border-bottom:1px solid var(--line);transition:padding .15s ease}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.word{font-family:var(--display);font-weight:900;font-size:34px;letter-spacing:.06em;line-height:1;text-transform:uppercase;display:flex;gap:2px}
.word span{position:relative}
.word span:nth-child(odd)::after{content:"";position:absolute;left:50%;top:-6px;width:4px;height:4px;border-radius:50%;background:var(--bulb);transform:translateX(-50%);box-shadow:0 0 6px var(--bulb)}
@media (prefers-reduced-motion:no-preference){.word span::after{animation:blink 2.4s infinite}.word span:nth-child(3)::after{animation-delay:.8s}.word span:nth-child(5)::after{animation-delay:1.6s}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.stamp{font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.02em;border:0;background:transparent;padding:2px 0;text-align:right}
.stamp b{color:var(--ink);font-weight:600}
header.compact{padding-block:6px;gap:6px}
header.compact .brand{display:none}
header.compact .tab{padding:6px 4px;font-size:13px}
header.compact .filters{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
header.compact .filters::-webkit-scrollbar{display:none}
header.compact .chip{padding:3px 9px;font-size:12px;flex:none}
header.compact .search{flex:0 0 150px;padding:4px 10px;font-size:13px}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px}
.tab{flex:1;border:0;background:transparent;padding:8px 4px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.12)}
.tab .n{font-family:var(--mono);font-size:11px;margin-left:4px;color:var(--muted)}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;background:var(--cat,var(--muted))}
.dot.music{--cat:var(--music)}.dot.comedy{--cat:var(--comedy)}.dot.theater{--cat:var(--theater)}
.search{flex:1 1 140px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px}

/* Sections */
section.tier{margin-top:22px}
.tier-h{display:flex;align-items:baseline;gap:10px;margin:0 0 10px}
.tier-h h2{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.04em;text-transform:uppercase;margin:0;text-wrap:balance}
.tier-h .count{font-family:var(--mono);font-size:12px;color:var(--muted)}
.blurb{font-size:13.5px;color:var(--muted);margin:-6px 0 10px}
.list{display:grid;gap:10px}
.month{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:16px 0 4px}
.more{margin-top:12px;width:100%;border:1px dashed var(--line);background:transparent;border-radius:var(--r);padding:10px;font-weight:600;color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:18px;color:var(--muted);font-size:14px;background:var(--surface)}
.empty b{color:var(--ink)}
.sortbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:16px}
.sortbar .left{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.count-line{font-size:13.5px;color:var(--muted)}
.seg{display:flex;background:var(--sunk);border-radius:8px;padding:3px}
.segb{border:0;background:transparent;border-radius:6px;padding:5px 10px;font-size:13px;font-weight:600;color:var(--muted)}
.segb[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.12)}
.note{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:14px;color:var(--muted)}
.note b{color:var(--ink)}
.strip{display:grid;gap:4px;margin-top:6px}
.strip-row{display:flex;gap:8px;align-items:baseline;font-size:13.5px;color:var(--ink);overflow-wrap:anywhere}
.strip-row .t{font-family:var(--mono);font-size:12px;color:var(--muted);flex:none;min-width:58px}
.strip-row button{border:0;background:transparent;padding:0;text-align:left;font-weight:600;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}

/* Ticket card */
.tix{--cat:var(--music);display:grid;grid-template-columns:58px 1fr;background:var(--surface);border-radius:var(--r);position:relative;border:1px solid var(--line);transition:transform .18s ease}
.tix.cat-comedy{--cat:var(--comedy)} .tix.cat-theater{--cat:var(--theater)}
.tix.top{border-color:color-mix(in srgb,var(--bulb) 75%,var(--line))}
.tix.swiping{transition:none}
.stub{border-right:2px dashed var(--line);padding:11px 3px;display:flex;flex-direction:column;align-items:center;gap:1px;font-family:var(--mono);position:relative;background:color-mix(in srgb,var(--cat) 9%,var(--surface));border-radius:var(--r) 0 0 var(--r)}
.stub::before,.stub::after{content:"";position:absolute;right:-8px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.stub::before{top:-8px;clip-path:inset(50% 0 0 0)}.stub::after{bottom:-8px;clip-path:inset(0 0 50% 0)}
.stub .mo{font-size:11px;letter-spacing:.14em;color:color-mix(in srgb,var(--cat) 70%,var(--ink));font-weight:600}
.stub .d{font-family:var(--display);font-weight:800;font-size:28px;line-height:1}
.stub .wd{font-size:10.5px;color:var(--muted)}
.stub .yr{font-size:10px;color:var(--muted);margin-top:3px;letter-spacing:.06em;padding:0 4px;border:1px solid var(--line);border-radius:4px}
.stub .yr.next{color:var(--ink);border-color:var(--ink);font-weight:600}
.stub .run{font-size:9.5px;color:var(--muted);text-align:center;margin-top:4px;line-height:1.2}
.body{padding:10px 11px 10px;min-width:0;display:grid;gap:3px;cursor:pointer}
.krow{display:flex;align-items:center;gap:6px;min-width:0}
.kicker{display:flex;gap:6px;align-items:center;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.newpill{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.08em;background:var(--ink);color:var(--bg);border-radius:4px;padding:1px 5px;flex:none}
.chev{border:0;background:transparent;width:28px;height:24px;margin:-4px -4px -4px 0;display:grid;place-items:center;color:var(--muted);flex:none;border-radius:6px}
.chev svg{width:16px;height:16px;transition:transform .15s ease}
.tix.open .chev svg{transform:rotate(180deg)}
.hl{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.05;letter-spacing:.01em;margin:0;overflow-wrap:anywhere;text-wrap:balance}
.nm-link{text-decoration:none;cursor:pointer}
.nm-link:hover{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.nm-ic{display:inline-block;width:.62em;height:.62em;margin-left:.22em;opacity:.45;vertical-align:.08em}
.nm-ic svg{width:100%;height:100%;display:block}
.fav{background:linear-gradient(transparent 58%, color-mix(in srgb,var(--bulb) 60%,transparent) 58%);color:var(--ink);padding:0 2px;border-radius:2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.fav-eyebrow{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink)}
.fav-eyebrow .star{color:var(--bulb);font-size:14px;line-height:1}
.sub{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.sub .nm-link{color:var(--ink);font-weight:600}
.meta{font-size:13.5px;overflow-wrap:anywhere}
.meta .t{font-family:var(--mono);font-size:12.5px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.b{font-size:12px;font-weight:600;border-radius:6px;padding:2px 7px;background:var(--sunk);color:var(--ink);border:1px solid transparent}
.b.love{background:color-mix(in srgb,var(--bulb) 24%,var(--surface))}
.b.soft{background:transparent;border-color:var(--line);color:var(--muted)}
.b.sale{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,var(--surface))}
.b.out{color:var(--muted);text-decoration:line-through}
.b.ok{color:var(--go);background:color-mix(in srgb,var(--go) 13%,var(--surface))}
.b.need{color:var(--warn);background:transparent;border-color:color-mix(in srgb,var(--warn) 55%,transparent)}
button.b{cursor:pointer;font-family:inherit}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.act{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 9px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:5px;text-decoration:none;white-space:nowrap}
.act:hover{border-color:var(--ink)}
.act.on.int{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.act.on.go{background:var(--go);color:#fff;border-color:var(--go)}
.act.ghost{border-color:transparent;color:var(--muted);padding-inline:6px}
.act svg{width:14px;height:14px}
.morebody{display:grid;gap:5px;margin-top:4px;padding-top:8px;border-top:1px dashed var(--line);cursor:default}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.linkbtn{border:0;background:transparent;padding:0;font-size:13px;font-weight:600;color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.songs{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.songs a{color:var(--ink);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--bulb) 70%,transparent);text-underline-offset:2px}
.friends{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.friends img{width:20px;height:20px;border-radius:50%;margin-right:-8px;border:2px solid var(--surface)}
.friends .names{margin-left:8px}
.group-list{display:grid;gap:8px;margin:-2px 0 4px 16px;padding-left:10px;border-left:2px dashed var(--line)}
.tix-row{display:grid;gap:6px;margin-top:4px;padding:8px 10px;border-radius:8px;background:var(--sunk);border:1px dashed var(--line);cursor:default}
.tix-row.have{background:color-mix(in srgb,var(--go) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--go) 55%,transparent)}
.tix-row.email{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tix-txt{flex:1;min-width:0;font-size:13.5px}
.tix-btns{display:flex;gap:6px;flex-wrap:wrap}
.chipx{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600}
.chipx.on{background:var(--go);border-color:var(--go);color:#fff}
.live-input{width:100%;min-width:0;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:13.5px;background:var(--surface)}
/* swipe hint, revealed beside the card while it slides */
.tix[data-swipe]::after{content:attr(data-label);position:absolute;top:50%;transform:translateY(-50%);font-weight:700;font-size:13px;padding:4px 10px;border-radius:999px;white-space:nowrap;opacity:.55}
.tix[data-swipe="right"]::after{right:calc(100% + 10px);background:var(--ink);color:var(--bg)}
.tix[data-swipe="left"]::after{left:calc(100% + 10px);background:var(--sunk);color:var(--ink);border:1px solid var(--line)}
.tix.armed::after{opacity:1}
@media (pointer:coarse){ .swipe-on .tix{touch-action:pan-y} }

/* Diary + acts */
.diary{display:grid;gap:8px}
.drow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:6px}
.drow .top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.drow .dt{font-family:var(--mono);font-size:12px;color:var(--muted)}
.drow .nm{font-weight:700}
.stars{display:flex;gap:2px}
.stars button{border:0;background:transparent;font-size:20px;line-height:1;padding:2px;color:var(--line)}
.stars button[aria-pressed="true"]{color:var(--ink)}
.acts{display:grid;gap:8px}
.act-row{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.act-row .rk{font-family:var(--display);font-weight:800;font-size:20px;width:34px;text-align:center;color:var(--muted);flex:none}
.act-row .info{flex:1;min-width:0}
.act-row .nm{font-weight:700;overflow-wrap:anywhere}
.act-row .ds{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.act-row .nx{font-family:var(--mono);font-size:12px}
.mini{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;text-decoration:none;border-radius:999px;padding:1px 8px;background:var(--sunk);margin-left:6px;vertical-align:2px}
.mini svg{width:11px;height:11px}
.toggle{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;background:var(--surface);flex:none}
.toggle[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.add{display:flex;gap:6px;margin-bottom:10px}
.add input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.add button{border:0;border-radius:8px;padding:8px 14px;background:var(--ink);color:var(--bg);font-weight:600}
.settings{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font-size:14px;margin-top:12px;flex-wrap:wrap}
.settings select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface);max-width:100%}

/* Side panel */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px}
.panel h3{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.04em;text-transform:uppercase;margin:0}
.prow{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:start;font-size:13.5px;border:0;background:transparent;padding:4px 0;text-align:left;width:100%}
.prow .t{font-family:var(--mono);font-size:11.5px;color:var(--muted);padding-top:2px}
.prow .nm{font-weight:700;overflow-wrap:anywhere}
.prow .vn{color:var(--muted);font-size:12.5px}
.log{font-family:var(--mono);font-size:12px;color:var(--muted);display:grid;gap:2px}

/* Sheet + toast */
.scrim{position:fixed;inset:0;background:rgb(0 0 0/.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px}
.sheet h3{font-family:var(--display);font-size:22px;margin:0;letter-spacing:.02em}
.sheet label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.sheet input,.sheet textarea{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--bg);width:100%}
.sheet .row{display:flex;gap:10px}.sheet .row>*{flex:1}
.sheet .btns{display:flex;gap:8px;justify-content:flex-end}
.primary{border:0;border-radius:8px;padding:9px 16px;background:var(--go);color:#fff;font-weight:700}
.secondary{border:1px solid var(--line);border-radius:8px;padding:9px 16px;background:transparent;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 12px;border-radius:10px;font-size:14px;z-index:30;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgb(0 0 0/.25);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toast button{border:1px solid currentColor;background:transparent;color:inherit;border-radius:6px;padding:3px 9px;font-weight:700;font-size:13px}
.loading{color:var(--muted);padding:30px 0;text-align:center;font-family:var(--mono);font-size:13px}
</style>

<div class="wrap">
<header id="hdr">
  <div class="brand">
    <div class="word" aria-label="Marquee"><span>M</span><span>a</span><span>r</span><span>q</span><span>u</span><span>e</span><span>e</span></div>
    <button class="stamp" id="stamp" type="button" aria-label="Refresh history">Loading shows…</button>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-feed" aria-selected="true" data-tab="feed">For you</button>
    <button class="tab" role="tab" id="tab-browse" aria-selected="false" data-tab="browse">Browse</button>
    <button class="tab" role="tab" id="tab-mine" aria-selected="false" data-tab="mine">Saved<span class="n" id="mineN"></span></button>
    <button class="tab" role="tab" id="tab-acts" aria-selected="false" data-tab="acts">Acts</button>
  </div>
  <div class="filters" id="filters">
    <button class="chip" data-cat="all" aria-pressed="true">All</button>
    <button class="chip" data-cat="music" aria-pressed="false"><i class="dot music"></i>Music</button>
    <button class="chip" data-cat="comedy" aria-pressed="false"><i class="dot comedy"></i>Comedy</button>
    <button class="chip" data-cat="theater" aria-pressed="false"><i class="dot theater"></i>Theater</button>
    <button class="chip" id="whereBtn" aria-pressed="true">Bay Area</button>
    <input class="search" id="q" type="search" placeholder="Search acts, venues" aria-label="Search acts or venues">
  </div>
</header>
<div class="layout">
  <main id="main"><div class="loading">Tuning up the marquee…</div></main>
  <aside id="side" aria-label="Your upcoming shows"></aside>
</div>
</div>
<div id="toastHost"></div>

<script>
(() => {
"use strict";
// ======================= utilities =======================
const $ = (s, r=document) => r.querySelector(s);

// AFF: normalized act name -> {name, score 0..1, why, kind, similar, spId, likedId, instagram, muted, learned}
let AFF = new Map(), LONG = [], SC = new Map(), MUSIC_GENRES = new Set(), LEARN = {act:new Map(), tag:new Map(), names:new Map()};
const performers = e => e.category==='theater' ? [] : [e.headliner, ...(e.supporting||[])].filter(Boolean);
const tagsOf = e => (e.tags||[]).map(t=>String(t).toLowerCase().trim()).filter(Boolean);
function learn(){
  const act=new Map(), tag=new Map(), names=new Map();
  const bump=(m,k,v)=>m.set(k,(m.get(k)||0)+v);
  for (const [id,m] of Object.entries(S.my.events||{})){
    const e=S.byId.get(id); const ps = e? performers(e) : (m.snap && m.snap.c!=='theater' ? [m.snap.h] : []);
    ps.forEach(n=>names.set(norm(n),n));
    if (m.s==='interested'||m.s==='going'){ ps.forEach((n,i)=>bump(act,norm(n), i===0?0.15:0.08)); if (e) tagsOf(e).forEach(t=>bump(tag,t,0.05)); }
    else if (m.s==='dismissed'){ if (ps[0]) bump(act,norm(ps[0]),-0.12); if (e) tagsOf(e).forEach(t=>bump(tag,t,-0.04)); }
    if (m.rating && ps[0]) bump(act, norm(ps[0]), m.rating>=4? 0.2 : m.rating<=2? -0.3 : 0);
  }
  for (const [k,v] of tag) tag.set(k, Math.max(-0.15, Math.min(0.15, v)));
  LEARN={act, tag, names};
}
function rebuildAffinity(){
  AFF=new Map();
  if (S.isOwner){
    for (const m of (S.music?.acts||[])){ const [name,score,why,spId,likedId,similar]=m; AFF.set(norm(name),{name,score,why,kind:'music',similar:!!similar,spId,likedId}); }
    for (const a of (S.owner?.acts||[])){ const k=norm(a.name); const p=AFF.get(k); AFF.set(k, Object.assign({}, p||{}, a, {score:Math.max(a.score||0, p?.score||0)})); }
  }
  for (const [k,t] of Object.entries(S.my.tracked||{})){
    if (t.on){ const p=AFF.get(k); AFF.set(k, Object.assign({name:t.name, kind:'tracked', why:'You track them'}, p||{}, {score:Math.max(p?.score||0, 0.75)})); }
    else AFF.delete(k);
  }
  learn();
  for (const [k,d] of LEARN.act){
    const p=AFF.get(k);
    if (p) AFF.set(k, {...p, score:Math.max(0, Math.min(1, p.score+d)), learned:d});
    else if (d>=0.15) AFF.set(k, {name:LEARN.names.get(k)||k, score:Math.min(0.6, 0.3+d), why:'You saved their shows', kind:'learned', learned:d});
  }
  for (const [k,name] of Object.entries(S.my.muted||{})){ const p=AFF.get(k); AFF.set(k, {...(p||{name}), score:0, muted:true}); }
  LONG=[...AFF.entries()].filter(([k,a])=>a.score>=0.3 && !a.muted && k.includes(' ') && k.length>=8).map(([k])=>k);
  SC.clear(); rebuildGenres();
}
// top music genres: tags on shows by artists you actually play (not similar-artist guesses), minus genres you keep hiding
function rebuildGenres(){
  const w=new Map();
  for (const e of S.events){ if (e.category!=='music') continue; const a=performers(e).map(n=>AFF.get(norm(n))).find(x=>x && x.kind==='music' && !x.similar && x.score>=0.3); if (!a) continue; for (const t of tagsOf(e)){ if (t!=='rock' && t!=='pop' && (LEARN.tag.get(t)||0)>=0) w.set(t,(w.get(t)||0)+a.score); } }
  MUSIC_GENRES=new Set([...w.entries()].sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]));
  SC.clear();
}
const loves = a => !!(a && !a.muted && !a.similar && a.score>=0.45);
const isFav = n => loves(AFF.get(norm(n)));
function scoreEvent(e){
  const hit=SC.get(e.id); if (hit) return hit;
  let best={s:0, why:'', loved:false};
  performers(e).forEach((n,i)=>{ const a=AFF.get(norm(n)); if (!a || a.muted) return; const s=a.score*(i===0?1:0.6);
    if (s>best.s) best={s, why: i===0? a.why : 'Opening: '+a.name+(a.why? ' · '+a.why : ''), loved:loves(a)}; });
  if (best.s<0.5 && e.category!=='theater'){ const t=' '+norm(e.title+' '+performers(e).join(' '))+' '; for (const k of LONG){ if (t.includes(' '+k+' ')){ const a=AFF.get(k); const s=a.score*0.9; if (s>best.s) best={s, why:a.why, loved:loves(a)}; } } }
  if (e.category==='music' && best.s<0.14 && MUSIC_GENRES.size){ const g=tagsOf(e).find(t=>MUSIC_GENRES.has(t)); if (g) best={s:0.14, why:'Your genre: '+g, loved:false}; }
  if (e.category==='theater' && e.pick && best.s<0.5) best={s:0.5, why:e.pick_reason||'Pick for you', loved:false};
  if (e.category==='comedy' && e.suggested && best.s<0.32) best={s:0.32, why:'Similar to comics you like', loved:false};
  let adj=0; for (const t of tagsOf(e)) adj+=LEARN.tag.get(t)||0; adj=Math.max(-0.15, Math.min(0.15, adj));
  const muted=!!AFF.get(norm(e.headliner))?.muted && e.category!=='theater';
  const mult = e.region==='bay'?1 : e.region==='ca'?0.5 : 0.3;
  let s = muted? 0 : Math.max(0, best.s + (best.s>0? adj : 0))*mult; if (e.status==='sold_out') s*=0.85;
  const r={score:s, why:best.why, loved:best.loved, muted}; SC.set(e.id, r); return r;
}

const spGo = u => u ? String(u).split('?')[0]+'?go=1' : u;   // web link that hands off to the Spotify app
function findLink(name, cat){
  const a=AFF.get(norm(name));
  if (cat==='comedy') return a?.instagram ? {href:'https://www.instagram.com/'+a.instagram+'/', label:'Instagram', icon:'ig'} : {href:'https://www.youtube.com/results?search_query='+encodeURIComponent(name+' stand up'), label:'YouTube', icon:'play'};
  if (a?.spId) return {href:spGo('https://open.spotify.com/artist/'+a.spId), label:'Spotify', icon:'play'};
  if (a?.spotify) return {href:spGo(a.spotify), label:'Spotify', icon:'play'};
  // phones hand search URLs to the app, which misreads a trailing /artists; desktop keeps it
  return {href:'https://open.spotify.com/search/'+encodeURIComponent(name)+(IS_MOBILE?'':'/artists'), label:'Spotify', icon:'play'};
}
function nameLink(n, cat, fav){
  const L=findLink(n, cat);
  return el('a',{class:'nm-link',href:L.href,target:'_blank',rel:'noopener',title:n+' on '+L.label}, fav? el('span',{class:'fav',text:n}) : n, el('span',{class:'nm-ic','aria-hidden':'true'}, icon(L.icon)));
}

let saveChain=Promise.resolve(), pendingSaves=0, lastLocalEdit=0, myLoaded=false, feedLoaded=false, booted=false, backfilled=false;

function savePrefs(patch){ if (!S.db || !S.myId) return; S.prefs=Object.assign({}, S.prefs||{}, patch); S.db.doc('data/users/'+S.myId+'/prefs').set(JSON.parse(JSON.stringify(S.prefs))).catch(()=>{}); }
// "new since your last visit": a visit is a session more than 3 hours after the previous one
let prefsLoaded=false;
function onPrefs(doc){
  if (prefsLoaded) return; prefsLoaded=true;
  S.prefs=doc? JSON.parse(JSON.stringify(doc)) : {};
  let seen=S.prefs.seen;
  if (!seen) { seen={prev:new Date(Date.now()-48*3600e3).toISOString(), last:nowISO()}; savePrefs({seen}); }
  else if (Date.now()-Date.parse(seen.last) > 3*3600e3) { seen={prev:seen.last, last:nowISO()}; savePrefs({seen}); }
  S.newSince=seen.prev; rerender();
}

// ======================= calendar sync =======================
// S.my.cal[eventId] = {id, kind, sig, calId}: what Marquee put on Google Calendar. reconcile() moves the
// calendar toward the current pick one event at a time and never blocks taps.
function parseTime(t){ if(!t) return null; const m=String(t).match(/(\d{1,2})(?::(\d{2}))?\s*([ap])\.?m?/i); if(!m) return null; let h=+m[1]%12; if(/p/i.test(m[3])) h+=12; return [h, +(m[2]||0)]; }
const iso = (date,h,mi) => date+'T'+String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0')+':00';
function addDays(s,n){ const d=pd(s); d.setDate(d.getDate()+n); return ymd(d); }
function findId(p){
  if (p==null) return null;
  if (typeof p==='string'){ try { p=JSON.parse(p); } catch { const m=p.match(/"id"\s*:\s*"([^"]+)"/) || p.match(/event[_ ]?id["'\s:=]+([A-Za-z0-9_]+)/i); return m?m[1]:null; } }
  if (typeof p!=='object') return null;
  return p.id || p.eventId || p.event_id || p.event?.id || p.event?.eventId || p.result?.id || null;
}
function calDesc(e, when){
  const parts=[];
  const showT = when?.time || e.time; const doorsT = when?.time ? null : e.doors;
  const timing=[doorsT? 'Doors '+doorsT : null, showT? 'Show '+showT : null].filter(Boolean).join(' · ');
  if (timing) parts.push(timing);
  if (e.supporting?.length) parts.push('With '+e.supporting.join(', '));
  if (e.ticket_url) parts.push('Tickets: '+e.ticket_url);
  if (e.on_sale && e.on_sale>=todayStr) parts.push('On sale: '+e.on_sale+(e.presale?' ('+e.presale+')':''));
  if (e.notes) parts.push(e.notes);
  parts.push('Saved from Marquee: '+ARTIFACT_URL+'#'+e.id);
  return parts.join('\n');
}
function calTimes(e, override){
  const date = override?.date || e.date;
  const show = override?.time ? parseTime(override.time) : parseTime(e.time);
  const doors = override?.time ? null : parseTime(e.doors);
  const start = doors || show;   // the calendar block starts when doors open
  if (!start) return {allDay:true, startTime:iso(date,0,0), endTime:iso(addDays(date,1),0,0)};
  const base = show || start; const dur = e.category==='theater'?150:180;
  const end=new Date(pd(date)); end.setHours(base[0], base[1]+dur);
  return {allDay:false, startTime:iso(date,start[0],start[1]), endTime:iso(ymd(end),end.getHours(),end.getMinutes())};
}
function calBody(e, kind, when){
  const going=kind==='going';
  let times;
  if (going) times = calTimes(e, when);
  else if (e.end_date && e.end_date>e.date && !parseTime(e.time)) {
    let day = addDays(e.end_date,-6); if (day<todayStr) day=todayStr; if (day<e.date) day=e.date;   // "closing soon" marker for a run
    times = {allDay:true, startTime:iso(day,0,0), endTime:iso(addDays(day,1),0,0)};
  } else times = calTimes(e);
  const summary = (going?'🎟 ':'☆ ')+(e.category==='theater'? e.title : e.headliner)+(e.end_date&&!going&&e.category==='theater'?' (closing '+fmtShort(e.end_date)+')':'')+' · '+e.venue;
  return {summary, location:[e.venue,e.address||e.city].filter(Boolean).join(', '), description:calDesc(e, going? when : null), availability: going?'AVAILABILITY_BUSY':'AVAILABILITY_FREE', allDay:times.allDay, startTime:times.startTime, endTime:times.endTime, colorId: going?'10':'5'};
}
function calError(err){
  const c=err?.code;
  if (c==='needs_reauth') return 'Reconnect Google Calendar in claude.ai Settings → Connectors to sync.';
  if (c==='server_not_connected'||c==='server_not_found') return 'Add Google Calendar in claude.ai Settings → Connectors to sync shows.';
  if (c==='selection_required') return 'Pick which Google Calendar connection to use when claude.ai asks.';
  if (c==='not_in_manifest'||c==='approval_required'||c==='consent_required') return 'Calendar access wasn’t allowed, so your pick is saved here only. Turn it on from Saved.';
  if (c==='blocked_by_policy') return 'Your organization blocks calendar access here. Saved here only.';
  if (c==='tool_error') return 'Google Calendar refused that change: '+(err.message||'unknown reason').slice(0,120);
  if (c==='server_unavailable'||c==='upstream_error') return 'Google Calendar didn’t answer. Your pick is saved; it will sync next time you open Marquee.';
  return 'Couldn’t update your calendar. Your pick is saved here.';
}
const DENY = new Set(['not_in_manifest','approval_required','consent_required','blocked_by_policy','not_granted','capability_disabled','capability_removed']);
async function calCall(tool, input){
  try { const r=await S.mcp.callTool(CAL, tool, input); return {ok:true, payload:r.payload}; }
  catch(err){ if (DENY.has(err?.code)) S.calPerm='denied'; return {ok:false, err}; }
}
async function refreshPerm(){
  if (!S.mcp || !S.perms){ S.calPerm = S.mcp? 'prompt':'unavailable'; return; }
  try { S.calPerm = await Promise.race([S.perms.state('mcp:'+CAL), new Promise(r=>setTimeout(()=>r('prompt'),4000))]); } catch { S.calPerm='prompt'; }
}
const calOn = () => !!(S.mcp && S.my.settings?.cal!==false && S.calPerm==='granted');
const calTarget = () => S.my.settings?.calId || null;
const withCal = (input, id) => (id||calTarget()) ? Object.assign({calendarId:id||calTarget()}, input) : input;
const wantOf = id => { const m=mark(id); return (m==='interested'||m==='going')? m : null; };
const CAL_FMT='v2';
const sigOf = id => { const m=S.my.events[id]; return CAL_FMT+'|'+(m?.s||'')+'|'+(m?.when?.date||'')+'|'+(m?.when?.time||''); };
async function lookupId(body){
  const r=await calCall('search_events',{query:body.summary.replace(/^\S+\s/,''), pageSize:10});
  if (!r.ok) return null;
  const p=r.payload; const list = Array.isArray(p)? p : (p?.events||p?.items||p?.results||[]);
  const day=body.startTime.slice(0,10);
  const hit=list.find(x=>{ const s=x?.summary||x?.title||''; const st=JSON.stringify(x?.start||x?.startTime||''); return s===body.summary && st.includes(day); }) || list.find(x=>(x?.summary||x?.title)===body.summary);
  return hit? (hit.id||hit.eventId||null) : null;
}
let announced=false;
async function reconcile(eid){
  if (!calOn()) return;
  if (S.syncing.has(eid)) { S.dirty.add(eid); return; }
  S.syncing.add(eid); rerender();
  try {
    for (let i=0;i<5;i++){
      S.dirty.delete(eid);
      if (!calOn()) break;
      const e=S.byId.get(eid); const want=wantOf(eid); const have=S.my.cal?.[eid]; const sig=sigOf(eid); const target=calTarget();
      if (have && e && (have.calId||null)!==target){          // calendar choice changed: move the event
        if (have.id){ const r=await calCall('delete_event', withCal({eventId:have.id}, have.calId)); if (!r.ok && r.err?.code!=='tool_error'){ toast(calError(r.err)); break; } }
        delete S.my.cal[eid]; persist(); continue;
      }
      if (want && e && !have){
        const body=calBody(e,want,S.my.events[eid]?.when);
        const r=await calCall('create_event', withCal(body));
        if (!r.ok){ toast(calError(r.err)); break; }
        const id=findId(r.payload) || await lookupId(body);
        S.my.cal=S.my.cal||{}; S.my.cal[eid]={id, kind:want, sig, calId:target}; persist();
        if (!id) toast('Added to Google Calendar, but Marquee couldn’t get its id, so remove it there by hand if you change your mind.');
      } else if (want && e && have && have.sig!==sig){
        if (!have.id){ S.my.cal[eid]={...have, sig}; persist(); break; }
        const r=await calCall('update_event', withCal(Object.assign({eventId:have.id}, calBody(e,want,S.my.events[eid]?.when)), have.calId));
        if (r.ok){ S.my.cal[eid]={...have, kind:want, sig}; persist(); }
        else if (r.err?.code==='tool_error'){ delete S.my.cal[eid]; persist(); continue; }
        else { toast(calError(r.err)); break; }

function setMark(e, status, override){
  const prev=S.my.events[e.id] ? JSON.parse(JSON.stringify(S.my.events[e.id])) : null;
  const undo={label:'Undo', fn:()=>restoreMark(e, prev)};

    delete S.my.events[e.id];

  } else {
    const keep = prev? {tix:prev.tix, rating:prev.rating, review:prev.review} : {};
    S.my.events[e.id]=JSON.parse(JSON.stringify(Object.assign({}, keep, {s:status, at:nowISO(), when: override||prev?.when||null, snap:snapOf(e, override||prev?.when)})));
    if (status==='dismissed') toast('Hidden.', e.category==='theater'? [undo] : [undo, {label:'Not into '+e.headliner.split(/[,&]| and /)[0].trim(), fn:()=>mute(e.headliner)}]);

function filtered(){
  const q=norm(S.q);
  return S.events.filter(e=>{
    if ((e.end_date||e.date) < todayStr) return false;
    if (S.cat!=='all' && e.category!==S.cat) return false;
    if (S.bay && e.region!=='bay' && !mark(e.id)) return false;
    if (q){ const hay=norm([e.title,e.headliner,(e.supporting||[]).join(' '),e.venue,e.city,tagsOf(e).join(' ')].join(' ')); if(!hay.includes(q)) return false; }
    return true;
  });
}
// repeat shows (same act + venue within 10 days) collapse into one card
function groupRows(rows){
  const sorted=[...rows].sort((a,b)=>byDate(a[0],b[0])); const groups=[]; const open=new Map();
  for (const r of sorted){ const e=r[0]; const k=e.category+'|'+norm(headOf(e))+'|'+norm(e.venue);
    const g=open.get(k);
    if (g && (pd(e.date)-pd(g.last))/864e5<=10){ g.members.push(r); g.last=e.date; }
    else { const ng={members:[r], last:e.date}; open.set(k,ng); groups.push(ng); } }
  return groups.map(g=>{ const ms=g.members; if (ms.length===1) return ms[0];
    const marked=ms.find(([e])=>mark(e.id)&&mark(e.id)!=='dismissed');
    const avail=ms.find(([e])=>e.status!=='sold_out') || ms[0];
    const rep=marked||avail; const best=Math.max(...ms.map(x=>x[1].score));
    return [rep[0], {...rep[1], score:best}, ms]; });
}
function tierSection(title, blurb, items, opts={}){

    if (!st || ev.pointerId!==st.id) return;
    const dx=ev.clientX-st.x, dy=ev.clientY-st.y;
    if (!st.active){
      if (Math.abs(dy)>14 && Math.abs(dy)>Math.abs(dx)) { st=null; return; }
      if (Math.abs(dx)>16 && Math.abs(dx)>Math.abs(dy)*1.4){ st.active=true; st.c.classList.add('swiping'); }
    }
    if (st?.active){ st.dx=dx; st.c.style.transform='translateX('+dx+'px)'; st.c.dataset.swipe= dx>0?'right':'left'; st.c.dataset.label= dx>0?'☆ Interested':'Hide'; st.c.classList.toggle('armed', Math.abs(dx)>90); }
  }, {passive:true});
  main.addEventListener('pointerup', ev=>{
    if (!st) return; const {c,dx,active}=st; st=null; if (!active) return;
    reset(c); suppressClick=Date.now();
    const e=S.byId.get(c.dataset.id); if (!e) return;
    if (dx>90){ if (!isSaved(e.id)) setMark(e,'interested'); else toast('Already saved.'); }
    else if (dx<-90 && mark(e.id)!=='dismissed') setMark(e,'dismissed');
  });
  main.addEventListener('pointercancel', ()=>{ if (st){ reset(st.c); st=null; } });
})();
// compact header while scrolling; keep the side panel below the header
(() => {
  const h=$('#hdr'); let on=false, ticking=false;
  const setH=()=>document.documentElement.style.setProperty('--hdr', h.offsetHeight+'px');
  window.addEventListener('scroll',()=>{ if (ticking) return; ticking=true; requestAnimationFrame(()=>{ ticking=false; const y=window.scrollY; const want = on ? y>40 : y>120; if (want!==on){ on=want; h.classList.toggle('compact',on); setH(); } }); }, {passive:true});
  window.addEventListener('resize', setH); setH();
  WIDE.addEventListener?.('change', ()=>render());
})();

// ======================= boot =======================
window.addEventListener('error', ev=>{ try { toast('Something broke: '+(ev.message||'unknown error')); } catch {} });
window.addEventListener('unhandledrejection', ev=>{ try { const m=ev.reason?.message||ev.reason?.code||String(ev.reason); toast('Something broke: '+m); } catch {} });
render();
(async () => {
  const within = (p, ms, fallback) => Promise.race([Promise.resolve(p).catch(()=>fallback), new Promise(r=>setTimeout(()=>r(fallback), ms))]);
  const [db,user] = await Promise.all([within(claude.use('db'),12000,null), within(claude.use('user'),12000,null)]);
  S.db=db; S.user=user;
  Promise.all([within(claude.use('mcp'),12000,null), within(claude.use('permissions'),12000,null)]).then(async ([mcp,perms])=>{ S.mcp=mcp; S.perms=perms; await refreshPerm(); rerender(); maybeBootSync(); });
  setTimeout(()=>{ if (!myLoaded){ myLoaded=true; rerender(); } }, 5000);
  if (user){ S.isOwner = await within(user.isOwner(),5000,false); S.myId = await within(user.id(),5000,null); }
  rebuildAffinity();
  if (!db){ S.dbReady=true; $('#stamp').textContent='Open in claude.ai to load shows'; render(); return; }
  const onErr = e => { if (e?.code==='revoked') toast('Access to this page changed. Reload to continue.'); };
  const backfill = () => {   // remember what each saved show was, so the diary works after it leaves the feed
    if (backfilled || !feedLoaded || !myLoaded) return; backfilled=true; let n=0;
    for (const [id,m] of Object.entries(S.my.events||{})){ const e=S.byId.get(id); if (e && !m.snap){ m.snap=snapOf(e, m.when); n++; } }
    if (n) persist();
  };
  db.collection('feed').onSnapshot(snap=>{
    const evs=[]; for (const d of snap.docs){ const b=d.data(); if (b?.events) evs.push(...b.events); }
    S.events=evs; S.byId=new Map(evs.map(e=>[e.id,e])); S.dbReady=true; SC.clear(); rebuildAffinity();
    rerender(); feedLoaded=true; backfill(); maybeBootSync();
  }, onErr);
  db.doc('profile/owner').onSnapshot(s=>{ S.owner=s.exists? s.data():null; rebuildAffinity(); rerender(); }, onErr);
  db.doc('profile/music').onSnapshot(s=>{ S.music=s.exists? s.data():null; rebuildAffinity(); rerender(); }, onErr);
  db.doc('profile/tracks').onSnapshot(s=>{ S.tracks=s.exists? s.data():null; rerender(); }, onErr);
  db.doc('meta/status').onSnapshot(s=>{ S.meta=s.exists? s.data():null; rerender(); }, onErr);
  if (S.myId){
    db.doc('data/users/'+S.myId+'/tickets').onSnapshot(s=>{ S.tix = s.exists? (s.data().events||{}) : {}; rerender(); }, ()=>{});
    db.doc('data/users/'+S.myId+'/prefs').onSnapshot(s=>onPrefs(s.exists? s.data() : null), ()=>onPrefs(null));
  }
  db.collection('marks').onSnapshot(async snap=>{
    const all={}; for (const d of snap.docs) all[d.id]=d.data();
    S.marks=all;
    if (S.myId && all[S.myId]){
      const mine=snap.docs.find(d=>d.id===S.myId);
      const quiet = !mine.metadata.hasPendingWrites && pendingSaves===0 && Date.now()-lastLocalEdit>4000;
      if (quiet || !myLoaded){
        const b=JSON.parse(JSON.stringify(all[S.myId]));   // snapshots are frozen; S.my must be editable
        const cal=Object.assign({}, b.cal||{});
        const early = myLoaded ? null : S.my;              // taps made before the first load win over stored values
        S.my={events:Object.assign({}, b.events||{}, early?.events||{}), tracked:Object.assign({}, b.tracked||{}, early?.tracked||{}),
              muted:Object.assign({}, b.muted||{}, early?.muted||{}), settings:Object.assign({cal:true}, b.settings||{}), cal:Object.assign(cal, early?.cal||{})};
        if (early && (Object.keys(early.events||{}).length || Object.keys(early.tracked||{}).length)) persist();
        rebuildAffinity();
      }
    }
    if (!myLoaded){ myLoaded=true; backfill(); maybeBootSync(); }
    const others=Object.keys(all).filter(id=>id!==S.myId); if (others.length) await friendsInfo(others);
    rerender();
  }, onErr);
})();
})();
</script>
